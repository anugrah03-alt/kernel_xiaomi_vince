name: Build StormBreaker Vince with SukiSU Ultra

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: vince-stock_defconfig

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            git libncurses-dev libssl-dev \
            python3 zip clang lld

      - name: Clone Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 clang

      - name: Apply SukiSU Ultra to kernel tree
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s nongki

      - name: Build kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make ${DEFCONFIG}
          make -j"$(nproc)"

      - name: Upload Image.gz-dtb
        uses: actions/upload-artifact@v4
        with:
          name: vince-kernel-image
          path: arch/arm64/boot/Image.gz-dtb
