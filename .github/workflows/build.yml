name: Build Kernel with Sukisu Ultra

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v3

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y git make gcc clang llvm lld bc flex bison libssl-dev libncurses-dev zip curl

    - name: Clone Proton Clang
      run: |
        git clone https://github.com/kdrag0n/proton-clang.git --depth=1 toolchains

    - name: Add Sukisu Ultra to Kernel
      run: |
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s nongki

    - name: Build Kernel
      run: |
        export PATH=$PWD/toolchains/bin:$PATH
        export CC=clang
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        make vince-stock_defconfig
        make -j$(nproc)

    - name: Upload Image.gz-dtb
      uses: actions/upload-artifact@v3
      with:
        name: boot-image
        path: arch/arm64/boot/Image.gz-dtb
