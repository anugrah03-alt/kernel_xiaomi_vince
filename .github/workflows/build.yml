name: Build StormBreaker Vince A10 + KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: vince-stock_defconfig
      KERNEL_DIR: kernel
      OUT_DIR: out

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            libncurses-dev rsync \
            build-essential git curl zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            clang lld llvm python3 python-is-python3

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git

      - name: Add KernelSU v0.9.5 (official)
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

      - name: Setup build environment
        run: |
          export PATH=$PWD/proton-clang/bin:$PATH
          mkdir -p $OUT_DIR

      - name: Build kernel
        run: |
          export PATH=$PWD/proton-clang/bin:$PATH
          make O=$OUT_DIR ARCH=arm64 $DEFCONFIG
          make -j$(nproc) O=$OUT_DIR ARCH=arm64 \
            CC=clang

      - name: Package kernel image
        run: |
          mkdir -p artifact
          cp $OUT_DIR/arch/arm64/boot/Image artifact/

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: artifact/Image
