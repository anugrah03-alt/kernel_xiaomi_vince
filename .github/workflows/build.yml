name: Build StormBreaker Vince A10 (KernelSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: vince-stock_defconfig
      KERNEL_DIR: kernel
      CLANG_DIR: proton-clang

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            build-essential git curl zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            clang lld llvm python3

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $CLANG_DIR

      - name: Add KernelSU v0.9.5 (official)
        run: |
          curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -s v0.9.5

      - name: Build kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          make O=out ARCH=arm64 $DEFCONFIG
          make -j$(nproc) O=out ARCH=arm64

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-vince
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtb
            out/arch/arm64/boot/dtbo.img
